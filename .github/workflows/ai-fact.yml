name: Daily AI Fact

on:
  schedule:
    # 9:00 AM Sri Lanka (UTC+5:30)
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update README
        run: node scripts/update-ai-fact.js

      - name: Commit

        run: |

          git config user.name github-actions

          git config user.email github-actions@github.com

          git add README.md
          git add data/state.json

          git diff --cached --quiet && exit 0

          git commit -m "🤖 Daily AI Fact"

      - name: Push
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}